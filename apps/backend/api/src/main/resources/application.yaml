spring:
  application:
    name: Fandza

  datasource:
    url: jdbc:postgresql://localhost:5432/fandza
    username: postgres
    password: 070239
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration